name: CI

# Corre em cada pull request e em cada push para develop/main.
# Se falhar, o PR fica bloqueado (ativa a proteção de branch no GitHub).
on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
